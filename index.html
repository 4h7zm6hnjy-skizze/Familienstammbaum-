<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b32"><title>Familienarchiv</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f1;color:#19372f;font:1rem/1.6 system-ui,sans-serif}header{background:#193c33;color:#fff;padding:1rem max(5vw,calc((100vw - 55rem)/2));border-bottom:4px solid #b89959;letter-spacing:.13em;text-transform:uppercase;font-size:.85rem}main{max-width:58rem;margin:auto;padding:clamp(18px,5vw,48px)}h1,h2{font-family:Georgia,serif;font-weight:normal;line-height:1.14}h1{font-size:clamp(2.6rem,7vw,4.8rem);margin:.45em 0 .25em}h2{font-size:1.7rem;margin:1.3em 0 .5em}label{font-weight:650;display:block;margin:.8rem 0 .25rem}input,select,button,.action{font:inherit;max-width:100%;border-radius:.45rem;padding:.68rem .85rem}input,select{border:1px solid #83978e;background:white;width:100%}button,.action{border:0;background:#204d40;color:white;cursor:pointer;display:inline-block;text-decoration:none}button:disabled{opacity:.65}form{margin:2rem 0;max-width:30rem}form button{margin-top:1rem}.line{display:flex;justify-content:space-between;gap:1rem;align-items:center}.quiet{color:#36594c;background:transparent;text-decoration:underline}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:.8rem}.card,details{background:#fff;border:1px solid #dad9cb;padding:1rem;border-radius:.5rem}.card strong{display:block;font:1.35rem Georgia,serif;margin-bottom:.35rem}.card button,.card a{margin-top:.7rem}details{margin:.5rem 0}summary{cursor:pointer;font-weight:600}details p{overflow-wrap:anywhere}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.8rem}small{color:#55655b}footer{margin:2rem 0;border-top:1px solid #c9caba;padding-top:1rem;color:#536258}[hidden]{display:none!important}
</style><header>Familienarchiv</header><main>
<section id="gate"><h1>Unsere Familienchronik</h1><p>Familienbücher, Urkunden und Stammbaum.</p><form id="entry"><label for="pass">Privater Zugangsschlüssel</label><input id="pass" type="password" required autocapitalize="none" spellcheck="false" autocomplete="off"><button>Archiv öffnen</button><p id="message" role="status"></p></form></section>
<section id="archive" hidden><div class="line"><small>Stand 24. November 2026</small><button class="quiet" id="lock">Sperren</button></div><h1>Familienarchiv</h1><div class="filters"><div><label for="family">Familie auswählen</label><select id="family"><option value="">Alle Familien</option></select></div><div><label for="query">Namen oder Ort suchen</label><input id="query" type="search" placeholder="z. B. Osterode"></div></div><h2>Bücher und Stammbaum</h2><div class="cards" id="cards"></div><h2 id="heading">Fundstellen</h2><div id="hits"></div></section><footer>Private Familienforschung</footer></main>
<script src="app.js" defer></script></html>
